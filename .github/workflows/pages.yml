name: Mettre en ligne (GitHub Pages)

# Dépôt « cura-site » : contient seulement le site construit, copié par scripts/publier-pages.sh du
# dépôt CURA. À chaque envoi sur main, le site est mis en ligne sur GitHub Pages (gratuit).
# Hébergement provisoire, en attendant Netlify et le nom de domaine.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
